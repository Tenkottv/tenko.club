# Checks the live site every 6 hours and after each deploy. A failed run emails the repository owner.
name: Uptime

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: [Site]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-live.sh
